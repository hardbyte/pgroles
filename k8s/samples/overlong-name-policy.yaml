# A policy name one character over the limit, which the CRD's CEL validation
# rule must reject at admission.
#
# Without the rule the API server accepts this, the operator truncates the name
# to 63 characters for the `pgroles.io/policy` label, and the policy then shares
# a label — and therefore a plan namespace, including plan cleanup that deletes
# objects — with any other policy sharing its first 63 characters.
#
# This manifest is expected to FAIL `kubectl apply`. It is not a valid policy.
apiVersion: pgroles.io/v1alpha1
kind: PostgresPolicy
metadata:
  name: a.very-long-policy.name-with-dots.and-dashes.at-the-limit.xxxxxy
  namespace: default
spec:
  connection:
    secretRef:
      name: postgres-credentials
  interval: "5m"

  roles:
    - name: never_created_user
      login: true
