apiVersion: pgroles.io/v1alpha1
kind: PostgresPolicy
metadata:
  name: observe-policy
  namespace: default
spec:
  connection:
    secretRef:
      name: postgres-credentials
  approval: manual
  interval: "5m"
  mode: observe

  roles:
    - name: observe-preview-user
      login: true
      comment: "Preview-only role"

  grants:
    - role: observe-preview-user
      privileges: [CONNECT]
      object:
        type: database
        name: postgres
