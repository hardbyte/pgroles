# Allow Kyverno's reports controller to resolve the CRDs referenced by the
# admission policies. Aggregation keeps this separate from Kyverno's managed
# installation roles.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pgroles-ephemeral-access-kyverno-reports
  labels:
    rbac.kyverno.io/aggregate-to-reports-controller: "true"
rules:
  - apiGroups: [pgroles.io]
    resources:
      - ephemeralaccesspolicies
      - ephemeralaccessrequests
      - ephemeralaccessrequests/status
    verbs: [get, list, watch]
---
# Kyverno's CEL ValidatingPolicy environment does not expose Kubernetes'
# `authorizer` variable. Keep the structural checks in CEL, and use the
# documented API-call context to perform real SubjectAccessReviews for the
# logical `use` and `approve` verbs.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: pgroles-ephemeral-access-authorization
  labels:
    app.kubernetes.io/name: pgroles-operator
    app.kubernetes.io/component: admission-policy
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: require-use-on-access-policy
      match:
        any:
          - resources:
              kinds: [pgroles.io/v1alpha1/EphemeralAccessRequest]
              operations: [CREATE]
      context:
        - name: subjectaccessreview
          apiCall:
            urlPath: /apis/authorization.k8s.io/v1/subjectaccessreviews
            method: POST
            data:
              - key: kind
                value: SubjectAccessReview
              - key: apiVersion
                value: authorization.k8s.io/v1
              - key: spec
                value:
                  resourceAttributes:
                    group: pgroles.io
                    resource: ephemeralaccesspolicies
                    namespace: "{{ request.namespace }}"
                    name: "{{ request.object.spec.accessPolicyRef.name }}"
                    verb: use
                  user: "{{ request.userInfo.username }}"
                  groups: "{{ request.userInfo.groups }}"
      validate:
        message: >-
          creating a request requires the use verb on the referenced
          EphemeralAccessPolicy
        deny:
          conditions:
            any:
              - key: "{{ subjectaccessreview.status.allowed }}"
                operator: NotEquals
                value: true

    - name: require-approve-on-decision-change
      match:
        any:
          - resources:
              kinds: [pgroles.io/v1alpha1/EphemeralAccessRequest/status]
              operations: [UPDATE]
      preconditions:
        any:
          - key: >-
              {{ request.object.status.conditions[?type == 'Approved'] || `[]` }}
            operator: NotEquals
            value: >-
              {{ request.oldObject.status.conditions[?type == 'Approved'] || `[]` }}
          - key: >-
              {{ request.object.status.conditions[?type == 'Denied'] || `[]` }}
            operator: NotEquals
            value: >-
              {{ request.oldObject.status.conditions[?type == 'Denied'] || `[]` }}
      context:
        - name: subjectaccessreview
          apiCall:
            urlPath: /apis/authorization.k8s.io/v1/subjectaccessreviews
            method: POST
            data:
              - key: kind
                value: SubjectAccessReview
              - key: apiVersion
                value: authorization.k8s.io/v1
              - key: spec
                value:
                  resourceAttributes:
                    group: pgroles.io
                    resource: ephemeralaccesspolicies
                    namespace: "{{ request.namespace }}"
                    name: "{{ request.object.spec.accessPolicyRef.name }}"
                    verb: approve
                  user: "{{ request.userInfo.username }}"
                  groups: "{{ request.userInfo.groups }}"
      validate:
        message: >-
          changing Approved or Denied requires the approve verb on the referenced
          EphemeralAccessPolicy
        deny:
          conditions:
            any:
              - key: "{{ subjectaccessreview.status.allowed }}"
                operator: NotEquals
                value: true
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: pgroles-ephemeral-access-decision-integrity
  labels:
    app.kubernetes.io/name: pgroles-operator
    app.kubernetes.io/component: admission-policy
spec:
  failurePolicy: Fail
  validationActions: [Deny]
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [pgroles.io]
        apiVersions: [v1alpha1]
        operations: [UPDATE]
        resources: [ephemeralaccessrequests/status]
  variables:
    - name: newDecisions
      expression: >-
        object.?status.conditions.orValue([]).filter(c,
          c.type in ['Approved', 'Denied'] && c.status == 'True')
  validations:
    - message: approval decisions must attest to the resolved bundle and duration
      expression: >-
        variables.newDecisions.all(c,
          has(object.status.resolvedAccess) &&
          has(c.bundleHash) && c.bundleHash == object.status.resolvedAccess.bundleHash &&
          has(c.grantedDuration) &&
            c.grantedDuration == object.status.resolvedAccess.grantedDuration)
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: pgroles-ephemeral-access-finalizers
  labels:
    app.kubernetes.io/name: pgroles-operator
    app.kubernetes.io/component: admission-policy
spec:
  failurePolicy: Fail
  validationActions: [Deny]
  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [pgroles.io]
        apiVersions: [v1alpha1]
        operations: [UPDATE]
        resources: [ephemeralaccessrequests, ephemeralaccesspolicies]
  validations:
    - message: only pgroles-operator may remove an ephemeral-access finalizer
      expression: >-
        !oldObject.?metadata.finalizers.orValue([]).exists(f,
          f in ['ephemeralaccessrequest.pgroles.io/finalizer',
                'ephemeralaccesspolicy.pgroles.io/finalizer']) ||
        object.?metadata.finalizers.orValue([]).exists(f,
          f in ['ephemeralaccessrequest.pgroles.io/finalizer',
                'ephemeralaccesspolicy.pgroles.io/finalizer']) ||
        request.userInfo.username ==
          'system:serviceaccount:pgroles-system:pgroles-operator'
