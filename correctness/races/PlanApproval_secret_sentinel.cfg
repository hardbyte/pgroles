\* The naive deferral: materialize the Secret at execution, but record the
\* planning-time `:missing` sentinel as the applied source version.
\*
\* Nothing unsafe executes and the workflow still converges — this is not a loop.
\* It costs exactly one extra human approval: the Secret is now real, the recorded
\* version says missing, so the next reconcile plans a password change for work it
\* has already done and blocks on a second decision. TLC reports ApprovalsBounded
\* violated. Threading the post-materialization version back out of execution is
\* what removes it.

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    SqlHashApproval = FALSE
    LockDuringApply = TRUE
    HasPasswordChange = TRUE
    MaxDrifts = 0
    DeferSecretMaterialization = TRUE
    RecordMaterializedVersion = FALSE
    SecretBeforeSql = TRUE
    MaxCrashes = 0
    MaxApprovals = 3

INVARIANT
    TypeOK
    NoUnreviewedExecution
    ExecutedWhatWasApproved
    NoStaleExecution
    NoSecretBeforeApproval
    PasswordRecoverable
    ApprovalsBounded

PROPERTY
    EventuallyApplies
