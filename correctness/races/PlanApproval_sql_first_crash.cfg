\* The same crash window with the writes in the opposite order: SQL first, then
\* the Secret.
\* 
\* TLC reports PasswordRecoverable violated. The transaction committed a password
\* the crash prevented from ever being written to a Secret, so the database holds
\* a credential that exists nowhere a client can read it and nowhere the operator
\* can recover it. That asymmetry — an unused Secret versus an unrecoverable
\* password — is why materialization is ordered before the transaction.

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    SqlHashApproval = FALSE
    LockDuringApply = TRUE
    HasPasswordChange = TRUE
    MaxDrifts = 0
    DeferSecretMaterialization = TRUE
    RecordMaterializedVersion = TRUE
    SecretBeforeSql = FALSE
    MaxCrashes = 1
    MaxApprovals = 3

INVARIANT
    TypeOK
    NoUnreviewedExecution
    ExecutedWhatWasApproved
    NoStaleExecution
    NoSecretBeforeApproval
    PasswordRecoverable

PROPERTY
    EventuallyApplies
