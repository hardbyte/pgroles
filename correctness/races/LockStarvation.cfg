\* Shipped behaviour: a plan that just failed is not re-executed inside
\* the retry window, so the failing reconcile writes neither status and
\* wakes nobody. A still reconciles on its interval — bounded by
\* MaxTicks — so it takes the lock a bounded number of times and B gets
\* it. EventuallyRecovers holds.
SPECIFICATION Spec

CONSTANTS
    SelfWakeOnPolicyStatus = FALSE
    SelfWakeOnPlanStatus = FALSE
    MaxTicks = 2
    MaxAttempts = 4

INVARIANT TypeOK

PROPERTY
    EventuallyRecovers
    NeverStarved
    LockHeldOnlyWhileRunning
    BNeverProgressesWhileLocked

\* Terminating behaviours are expected: once A stops waking and B has
\* recovered, there is nothing left to do. That is success, not deadlock.
CHECK_DEADLOCK FALSE
