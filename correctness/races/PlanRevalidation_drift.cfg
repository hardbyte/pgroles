\* RevalidationMode = "generational", with the database allowed to drift.
\*
\* The generational strategy keeps the summary and the plan paired as long as
\* every change arrives as a policy edit — the generation moves, and it
\* supersedes. Drift carries no generation bump, so it has nothing to trigger
\* on: it refreshes the reported summary from the new database state and
\* retains a plan holding the old effects. TLC reports SummaryMatchesPlan
\* violated. The shipped "semantic" strategy compares the effects themselves
\* and passes the same configuration.

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    RevalidationMode = "generational"
    MaxDrifts = 1
    MaxEdits = 2

\* Scoped to property 1 on purpose. "generational" also leaves an empty plan
\* behind when the effects vanish — the same defect PlanRevalidation_replace.cfg
\* isolates — and checking both here would leave which violation TLC reports
\* first an accident of exploration order.
INVARIANT
    TypeOK
    SummaryMatchesPlan
