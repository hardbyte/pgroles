    SqlHashApproval = FALSE
    LockDuringApply = TRUE
    HasPasswordChange = TRUE
    MaxDrifts = 0
    DeferSecretMaterialization = TRUE
    RecordMaterializedVersion = TRUE
    SecretBeforeSql = TRUE
    MaxCrashes = 0
    MaxApprovals = 3

INVARIANT
    TypeOK
    NoUnreviewedExecution
    ExecutedWhatWasApproved
    NoStaleExecution
    NoSecretBeforeApproval
    PasswordRecoverable
    ApprovalsBounded

PROPERTY
    EventuallyApplies
