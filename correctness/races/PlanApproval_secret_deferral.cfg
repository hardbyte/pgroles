\* The shipped #181 design, on a settled policy: the generated Secret is written
\* only while an approved plan executes, and the source version the Secret
\* reported is what the policy records.
\* 
\* Passes. With MaxDrifts = 0 nothing outside the operator moves, so a single
\* human decision is all the work there is — which is what ApprovalsBounded
\* asserts, and what the two failing companions below each break.

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

