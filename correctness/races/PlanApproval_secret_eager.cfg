\* Materialization at planning time — pgroles before #181. Resolving a
\* `password.generate` role created the Kubernetes Secret during reconciliation,
\* so the credential existed while the plan was still only pending, and survived a
\* plan that was rejected or never approved.
\*
\* TLC reports NoSecretBeforeApproval violated on the first plan creation.

