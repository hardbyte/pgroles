\* The bug, before any fix: the failing reconcile rewrites both the
\* policy status and its plan's status, and the controller watches
\* both. Each attempt schedules the next, so A's wake never runs out
\* and it can hold the lock whenever B tries. B burns every attempt and
\* its caller gives up.
SPECIFICATION Spec

CONSTANTS
    SelfWakeOnPolicyStatus = TRUE
    SelfWakeOnPlanStatus = TRUE
    MaxTicks = 2
    MaxAttempts = 4

INVARIANT TypeOK

PROPERTY
    EventuallyRecovers
    LockHeldOnlyWhileRunning
    BNeverProgressesWhileLocked

\* Terminating behaviours are expected: once A stops waking and B has
\* recovered, there is nothing left to do. That is success, not deadlock.
CHECK_DEADLOCK FALSE
