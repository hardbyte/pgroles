\* The shipped design, with a change set that carries no password.
\*
\* This configuration exists for mutation coverage of the approval gate itself.
\* Under HasPasswordChange = TRUE, `OperatorExecutes` also requires
\* `planRenderStale`, which only `OperatorRevalidates` can set and which itself
\* requires `approved` — so deleting the `approved` conjunct from
\* `OperatorExecutes` leaves the gate standing transitively, and every existing
\* configuration still passes. A plan with no password change has no such
\* second path: drop the conjunct and TLC reports NoUnreviewedExecution
\* violated on the first execution.
\*
\* Passes as written. It is the mutant that must fail.

SPECIFICATION Spec

\* Reaching Applied is a terminal success state with no further actions
\* enabled; that is convergence, not a deadlock.
CHECK_DEADLOCK FALSE

CONSTANTS
    SqlHashApproval = FALSE
    LockDuringApply = TRUE
    HasPasswordChange = FALSE
    MaxDrifts = 1

INVARIANT
    TypeOK
    NoUnreviewedExecution
    ExecutedWhatWasApproved
    NoStaleExecution

PROPERTY
    EventuallyApplies
