\* The first attempt at the fix, and why this model exists.
\*
\* Suppressing the policy-status write is a real change — that self-wake
\* loop is genuine — but the plan-status write regenerates the wake on
\* its own, so the storm continues. In CI the reconcile rate went *up*,
\* because each cycle had one less API write to make.
\*
\* A fix that addresses one of two sufficient causes is not a fix, and
\* nothing in the test suite said so.
SPECIFICATION Spec

CONSTANTS
    SelfWakeOnPolicyStatus = FALSE
    SelfWakeOnPlanStatus = TRUE
    MaxTicks = 2
    MaxAttempts = 4

INVARIANT TypeOK

PROPERTY
    EventuallyRecovers
    LockHeldOnlyWhileRunning
    BNeverProgressesWhileLocked

\* Terminating behaviours are expected: once A stops waking and B has
\* recovered, there is nothing left to do. That is success, not deadlock.
CHECK_DEADLOCK FALSE
