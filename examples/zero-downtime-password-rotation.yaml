# Example: Zero-downtime password rotation with paired login roles
#
# Rotating a login role's password normally risks a window where running
# application instances still hold the old credential. The classic fix is
# two interchangeable login roles ("blue" and "green"): the application
# switches to green while blue's connections drain and its password is
# rotated, then back the other way on the next rotation.
#
# The catch (https://github.com/thepartly/pgroles/issues/132): a table
# created while running as green is OWNED by green, so after switching
# back to blue the application can no longer CREATE INDEX on or ALTER it.
#
# The fix: both login roles declare `config: { role: combined }`, so
# PostgreSQL runs SET ROLE at connect time and every object is owned by
# the shared "combined" role regardless of which credential created it.
#
# `config` can set any role-level default (search_path, statement_timeout,
# custom app.* settings, ...). Values are always strings — quote numbers
# and booleans (e.g. statement_timeout: "30s", jit: "off").
#
# Usage:
#   export BLUE_PASSWORD="strong-random-password"
#   export GREEN_PASSWORD="another-strong-password"
#   pgroles apply -f examples/zero-downtime-password-rotation.yaml --database-url postgres://...

schemas:
  - name: app
    owner: combined

roles:
  # Shared owner role. Never logs in; owns the schema and all objects.
  - name: combined

  - name: blue
    login: true
    password:
      from_env: BLUE_PASSWORD
    config:
      role: combined

  - name: green
    login: true
    password:
      from_env: GREEN_PASSWORD
    config:
      role: combined

# The `role: combined` setting only works if the login roles are members
# of "combined" — pgroles validates this at manifest-validation time.
memberships:
  - role: combined
    members:
      - name: blue
      - name: green
