name: Operator Fairness and Load

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

concurrency:
  group: operator-fairness-load
  cancel-in-progress: false

jobs:
  decide:
    name: Decide whether to run
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/github-script@v9
        id: decide
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('should_run', 'true');
              core.setOutput('reason', 'manual dispatch');
              return;
            }

            const { owner, repo } = context.repo;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: 'operator-fairness-load.yml',
              branch: 'main',
              status: 'completed',
              per_page: 100,
            });

            const previousSuccess = runs.find(
              (run) => run.id !== context.runId && run.conclusion === 'success',
            );

            if (!previousSuccess) {
              core.setOutput('should_run', 'true');
              core.setOutput('reason', 'first successful run for this workflow');
              return;
            }

            if (previousSuccess.head_sha === context.sha) {
              core.setOutput('should_run', 'false');
              core.setOutput(
                'reason',
                `main unchanged since last successful fairness/load run (${context.sha.slice(0, 7)})`,
              );
              return;
            }

            core.setOutput('should_run', 'true');
            core.setOutput(
              'reason',
              `main changed from ${previousSuccess.head_sha.slice(0, 7)} to ${context.sha.slice(0, 7)}`,
            );

      - name: Summary
        run: |
          echo "Decision: ${{ steps.decide.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

  skipped:
    name: Skipped
    needs: decide
    if: needs.decide.outputs.should_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain skip
        run: |
          echo "Skipping fairness/load run: ${{ needs.decide.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

  fairness-load:
    name: Fairness and Load
    needs: decide
    if: needs.decide.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Shared with CI's E2E suites — installs kind, both CRDs, deploys
      # dev PostgreSQL, builds and deploys the operator, and verifies it
      # by reconciling `basic-policy`. Keeping fairness on the same
      # composite action prevents the inline copy from drifting again
      # (as it did between #74 and #102).
      - uses: ./.github/actions/setup-e2e
        with:
          cluster-name: pgroles-fairness

      - name: Prepare fairness-specific state
        run: |
          # Free up `basic-policy` (created by the composite for its
          # health check) so it doesn't compete with fairness scenarios.
          kubectl delete pgr basic-policy --wait=true

          # Add the second `churntest` database + secret. The composite
          # already provisions `loadtest` + `loadtest-postgres-credentials`.
          kubectl exec -i postgres-0 -- psql -v ON_ERROR_STOP=1 -U postgres -d postgres <<'SQL'
          CREATE DATABASE churntest;
          SQL

          kubectl create secret generic churntest-postgres-credentials \
            --from-literal=DATABASE_URL='postgres://postgres:devpassword@postgres.default.svc.cluster.local:5432/churntest' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Run fairness and load scenarios
        run: |
          wait_for_ready_true() {
            policy="$1"
            attempts="${2:-90}"
            sleep_secs="${3:-5}"
            for i in $(seq 1 "$attempts"); do
              status="$(kubectl get pgr "$policy" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)"
              if [ "$status" = "True" ]; then
                echo "$policy reached Ready=True"
                return 0
              fi
              echo "Waiting for $policy Ready=True... (attempt $i/$attempts)"
              sleep "$sleep_secs"
            done
            echo "::error::$policy did not reach Ready=True"
            kubectl get pgr "$policy" -o yaml || true
            kubectl -n pgroles-system logs deployment/pgroles-operator --tail=200 || true
            return 1
          }

          wait_for_ready_reason() {
            policy="$1"
            expected_reason="$2"
            attempts="${3:-60}"
            sleep_secs="${4:-5}"
            for i in $(seq 1 "$attempts"); do
              status="$(kubectl get pgr "$policy" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)"
              reason="$(kubectl get pgr "$policy" -o jsonpath='{.status.conditions[?(@.type=="Ready")].reason}' 2>/dev/null || true)"
              if [ "$status" = "False" ] && [ "$reason" = "$expected_reason" ]; then
                echo "$policy reached Ready=False with reason=$expected_reason"
                return 0
              fi
              echo "Waiting for $policy Ready=False/$expected_reason... (attempt $i/$attempts)"
              sleep "$sleep_secs"
            done
            echo "::error::$policy did not reach Ready=False with reason=$expected_reason"
            kubectl get pgr "$policy" -o yaml || true
            kubectl -n pgroles-system logs deployment/pgroles-operator --tail=200 || true
            return 1
          }

          create_objects() {
            db="$1"
            prefix="$2"
            count="$3"
            {
              echo "BEGIN;"
              for i in $(seq -w 1 "$count"); do
                echo "CREATE SCHEMA IF NOT EXISTS ${prefix}_${i};"
                echo "CREATE TABLE IF NOT EXISTS ${prefix}_${i}.items (id integer generated always as identity primary key, name text not null);"
                echo "CREATE SEQUENCE IF NOT EXISTS ${prefix}_${i}.audit_seq;"
              done
              echo "COMMIT;"
            } | kubectl exec -i postgres-0 -- psql -v ON_ERROR_STOP=1 -U postgres -d "$db"
          }

          bash scripts/generate-load-policy.sh 20 /tmp/fair-a.yaml fair-a postgres-credentials faira
          bash scripts/generate-load-policy.sh 20 /tmp/fair-b.yaml fair-b postgres-credentials fairb
          bash scripts/generate-load-policy.sh 20 /tmp/fair-c.yaml fair-c postgres-credentials fairc
          bash scripts/generate-load-policy.sh 20 /tmp/load-a.yaml load-a loadtest-postgres-credentials loada
          bash scripts/generate-load-policy.sh 20 /tmp/churn-a.yaml churn-a churntest-postgres-credentials churna

          create_objects postgres faira 20
          create_objects postgres fairb 20
          create_objects postgres fairc 20
          create_objects loadtest loada 20
          create_objects churntest churna 20

          fairness_start="$(date +%s)"
          kubectl apply -f /tmp/fair-a.yaml
          kubectl apply -f /tmp/fair-b.yaml
          kubectl apply -f /tmp/fair-c.yaml
          kubectl apply -f /tmp/load-a.yaml
          kubectl apply -f /tmp/churn-a.yaml

          wait_for_ready_true fair-a
          wait_for_ready_true fair-b
          wait_for_ready_true fair-c
          wait_for_ready_true load-a
          wait_for_ready_true churn-a
          initial_elapsed="$(( $(date +%s) - fairness_start ))"

          for cycle in 1 2 3; do
            kubectl create secret generic postgres-credentials \
              --from-literal=DATABASE_URL='postgres://postgres:devpassword@postgres.default.svc.cluster.local:15432/postgres' \
              --dry-run=client -o yaml | kubectl apply -f -

            wait_for_ready_reason fair-a DatabaseConnectionFailed
            wait_for_ready_reason fair-b DatabaseConnectionFailed
            wait_for_ready_reason fair-c DatabaseConnectionFailed
            wait_for_ready_true load-a 20 3
            wait_for_ready_true churn-a 20 3

            kubectl create secret generic postgres-credentials \
              --from-literal=DATABASE_URL='postgres://postgres:devpassword@postgres.default.svc.cluster.local:5432/postgres' \
              --dry-run=client -o yaml | kubectl apply -f -

            wait_for_ready_true fair-a
            wait_for_ready_true fair-b
            wait_for_ready_true fair-c
            echo "Completed shared-secret churn cycle $cycle"
          done

          kubectl create secret generic churntest-postgres-credentials \
            --from-literal=DATABASE_URL='postgres://postgres:devpassword@postgres.default.svc.cluster.local:15432/churntest' \
            --dry-run=client -o yaml | kubectl apply -f -
          wait_for_ready_reason churn-a DatabaseConnectionFailed
          wait_for_ready_true fair-a 20 3
          wait_for_ready_true load-a 20 3

          kubectl create secret generic churntest-postgres-credentials \
            --from-literal=DATABASE_URL='postgres://postgres:devpassword@postgres.default.svc.cluster.local:5432/churntest' \
            --dry-run=client -o yaml | kubectl apply -f -
          wait_for_ready_true churn-a

          total_elapsed="$(( $(date +%s) - fairness_start ))"
          printf 'Scheduled fairness/load workflow converged in %ss across %s policies, %s databases, %s schemas, and %s generated roles\n' \
            "$total_elapsed" "5" "3" "100" "200" >> "$GITHUB_STEP_SUMMARY"
          printf 'Initial convergence completed in %ss before churn cycles\n' "$initial_elapsed" >> "$GITHUB_STEP_SUMMARY"

          postgres_role_count="$(
            printf '%s\n' "SELECT count(*) FROM pg_roles WHERE rolname ~ '^(fair[abc]_[0-9]{2}|loada_[0-9]{2}|churna_[0-9]{2})-(editor|viewer)$';" \
              | kubectl exec -i postgres-0 -- psql -U postgres -tA
          )"
          test "$postgres_role_count" = "200"

          kubectl exec postgres-0 -- psql -U postgres -d postgres -tAc "SELECT has_schema_privilege('faira_01-editor', 'faira_01', 'USAGE');" | grep -qx "t"
          kubectl exec postgres-0 -- psql -U postgres -d postgres -tAc "SELECT has_table_privilege('fairc_20-viewer', 'fairc_20.items', 'SELECT');" | grep -qx "t"
          kubectl exec postgres-0 -- psql -U postgres -d loadtest -tAc "SELECT has_sequence_privilege('loada_05-editor', 'loada_05.audit_seq', 'USAGE');" | grep -qx "t"
          kubectl exec postgres-0 -- psql -U postgres -d churntest -tAc "SELECT has_table_privilege('churna_10-viewer', 'churna_10.items', 'SELECT');" | grep -qx "t"

      # The fairness scenarios are the heaviest shape this repository runs:
      # five policies across three databases, applied at once and then churned
      # through credential failures. A change that makes concurrent reconciles
      # cost more memory shows up here and nowhere else, and only as a restart
      # — every assertion above is about convergence, which an operator that
      # was OOM-killed and came back can still eventually satisfy.
      - name: Assert the operator survived the run
        run: |
          source scripts/e2e-helpers.sh
          assert_operator_healthy

      - name: Cleanup
        if: always()
        run: kind delete cluster --name pgroles-fairness

  # ---------------------------------------------------------------------------
  # ACL inspection burst — does peak memory track the concurrency bound or the
  # policy count?
  # ---------------------------------------------------------------------------
  #
  # The fairness scenarios above cover contention. This one covers allocation,
  # which is the failure mode this guards against: reconciling a policy
  # materialises its database's whole managed ACL surface, and with
  # unbounded concurrency every policy due at once allocates its own copy. On
  # startup that is all of them.
  #
  # Its own cluster, because the fixture is large and its two operator restarts
  # would perturb the fairness timings next door.
  acl-inspection-burst:
    name: ACL Inspection Burst (${{ matrix.workers }} workers)
    needs: decide
    if: needs.decide.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        workers: [1, 2]
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-e2e
        with:
          cluster-name: pgroles-acl-burst

      - name: Set runtime worker count
        run: |
          kubectl -n pgroles-system set env deployment/pgroles-operator TOKIO_WORKER_THREADS=${{ matrix.workers }}
          kubectl -n pgroles-system rollout status deployment/pgroles-operator --timeout=180s

      - name: Give the operator room to show the difference
        run: |
          # The chart ships a 128Mi limit, which this fixture exceeds under
          # either configuration — that is itself worth knowing, and is the
          # subject of a separate conversation about the shipped defaults. The
          # question here is the *shape* of the growth, so the limit is raised
          # far enough that the bounded run has clear headroom and the
          # unbounded run is free to be much larger before the kernel steps in.
          kubectl -n pgroles-system set resources deployment/pgroles-operator \
            --containers=operator --limits=memory=512Mi --requests=memory=64Mi
          kubectl -n pgroles-system rollout status deployment/pgroles-operator --timeout=180s

          # Free up `basic-policy` (created by the composite for its health
          # check) so it is not one more thing reconciling during the burst.
          kubectl delete pgr basic-policy --wait=true

      - name: Run the ACL inspection burst
        run: scripts/e2e-acl-inspection-burst.sh

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pgr -A -o wide || true
          kubectl -n pgroles-system get pods -o wide || true
          kubectl -n pgroles-system logs deployment/pgroles-operator --tail=500 || true
          kubectl -n pgroles-system logs deployment/pgroles-operator --previous --tail=500 || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -100 || true

      - name: Cleanup
        if: always()
        run: kind delete cluster --name pgroles-acl-burst

  # ---------------------------------------------------------------------------
  # Notify on failure
  # ---------------------------------------------------------------------------
  #
  # A nightly nobody reads is a nightly nobody runs. Failures land as an issue
  # so they surface where the rest of the work does, and repeat failures append
  # to the open one rather than filing a new issue every morning.
  notify-failure:
    name: Create issue on failure
    needs:
      - decide
      - fairness-load
      - acl-inspection-burst
    # Branch dispatches are useful for validating changes to this workflow, but
    # must not create repository issues. Only failures of the workflow on main
    # represent the maintained nightly signal.
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
      - name: Build issue body
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # The heredoc body is indented to match the surrounding YAML block, so
          # it is unindented on the way out — ten leading spaces would render
          # the whole issue as one code block.
          sed 's/^          //' > issue_body.md <<EOF
          Nightly operator fairness/load run failed on $(date -u +%Y-%m-%d), at commit \`${{ github.sha }}\`.

          **Job results:**
          - fairness-load: ${{ needs.fairness-load.result }}
          - acl-inspection-burst: ${{ needs.acl-inspection-burst.result }}

          A failing \`acl-inspection-burst\` means peak reconcile memory is tracking policy
          count rather than the concurrency bound, or the operator was killed reconciling
          its own policies. A failing \`fairness-load\` means policies are starving each
          other, most often behind a shared credential failure.

          [View run](${RUN_URL})
          EOF
      - name: Create or update the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The label has to exist before it can be filtered on or applied.
          gh label create nightly-failure \
            --description "A scheduled run failed" --color B60205 2>/dev/null || true
          EXISTING="$(gh issue list --label nightly-failure --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file issue_body.md
          else
            gh issue create \
              --title "Nightly operator fairness/load failure ($(date -u +%Y-%m-%d))" \
              --body-file issue_body.md \
              --label nightly-failure
          fi
