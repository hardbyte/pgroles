name: Docs Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs-pages.yml"
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]
    paths:
      - "docs/**"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

concurrency:
  # Serialize updates and cleanup for each preview without letting unrelated
  # pull requests cancel one another. Production remains a separate lane.
  group: >-
    pgroles-docs-${{
      github.event_name == 'pull_request'
      && format('pr-{0}', github.event.pull_request.number)
      || github.event_name == 'push'
      && 'production'
      || format('manual-{0}', github.run_id)
    }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v6

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lab exercises against PGlite
        run: npm run test:labs

      - name: Build static export
        env:
          DOCS_BASE_PATH: >-
            ${{
              github.event_name == 'pull_request'
              && format('{0}/pr-preview/pr-{1}', steps.pages.outputs.base_path, github.event.pull_request.number)
              || steps.pages.outputs.base_path
            }}
        run: npm run build

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Upload docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: pgroles-docs-${{ github.run_id }}
          path: docs/out
          include-hidden-files: true
          if-no-files-found: error

  preview:
    name: Deploy docs preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: pgroles-docs-${{ github.run_id }}
          path: site

      - name: Publish pull request preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          qr-code: "false"

  remove-preview:
    name: Remove docs preview
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Remove pull request preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          action: remove
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          qr-code: "false"

  deploy:
    name: Deploy docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: pgroles-docs-${{ github.run_id }}
          path: site

      - name: Publish production site
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: site
          clean-exclude: |
            pr-preview
            README.md
            index.yaml
          force: false
