name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  # candidate-ci queries this repository's CI runs.
  actions: read

jobs:
  # ---------------------------------------------------------------------------
  # Exact-commit CI gate
  # ---------------------------------------------------------------------------
  # A tag is irreversible the moment crates.io and GHCR are involved, so require
  # that CI already passed on this exact commit. CI runs automatically on pushes
  # to main and release/**, so the run this looks for is the one triggered by
  # merging the release-prep PR — tag that commit once it is green and no manual
  # dispatch is needed.
  candidate-ci:
    name: Verify CI passed on this commit
    runs-on: ubuntu-latest
    steps:
      - name: Require a successful CI run for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          count=$(gh api -X GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="${EXPECTED_SHA}" \
            -f event=push \
            -f status=success \
            -f per_page=100 \
            --jq '.total_count')
          if [ "$count" -lt 1 ]; then
            echo "::error::No successful CI run exists for ${EXPECTED_SHA}. CI runs automatically on pushes to main and release/**; wait for that run to go green and tag that exact commit. A tag on a commit CI has not passed cannot be released."
            exit 1
          fi
          echo "Found ${count} successful CI run(s) for ${EXPECTED_SHA}."

  # ---------------------------------------------------------------------------
  # Immutable-release gate
  # ---------------------------------------------------------------------------
  # Immutable releases freeze their assets the moment they are published, so the
  # release has to exist as a draft while the binaries are attached. Publishing
  # from the GitHub UI creates the tag itself, which means this workflow arrives
  # to find the release already frozen and cannot attach anything.
  #
  # Establishing the draft is therefore the first thing that happens: every
  # publishing job below waits on it, so that case fails while nothing has
  # reached crates.io or GHCR. Release by pushing the tag and let this workflow
  # own the release object.
  prepare-github-release:
    name: Prepare draft GitHub Release
    needs: [candidate-ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Create or verify draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          err="${RUNNER_TEMP}/release-view.err"

          # Only an explicit "not found" means there is no release yet. Any other
          # failure — auth, rate limiting, a 5xx — must not be mistaken for one,
          # or this gate stops gating.
          if is_draft=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>"$err"); then
            if [ "$is_draft" != "true" ]; then
              echo "::error::GitHub Release ${tag} is already published, so its assets are immutable and the release binaries cannot be attached. Delete the release (the tag can stay) and re-run this workflow. Release by pushing the tag — this workflow creates the draft, attaches the binaries, and publishes it."
              exit 1
            fi
            echo "Draft release ${tag} already exists; reusing it."
            exit 0
          elif ! grep -qi 'release not found' "$err"; then
            echo "::error::Could not determine whether release ${tag} already exists: $(cat "$err")"
            exit 1
          fi

          # Lead the body with this version's changelog entry, the way releases
          # read before the process moved into this workflow. GitHub appends its
          # generated "What's Changed" list after it.
          awk -v section="## [${tag#v}]" '
            index($0, section) == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md

          release_args=(--verify-tag --title "$tag" --generate-notes --draft)
          if [ -s release-notes.md ]; then
            release_args+=(--notes-file release-notes.md)
          else
            echo "::warning::No CHANGELOG.md section found for ${tag}; using generated notes only."
          fi
          if [[ "$tag" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "$tag" "${release_args[@]}"

  # ---------------------------------------------------------------------------
  # Build & push Docker images (multi-arch)
  # ---------------------------------------------------------------------------
  docker-operator:
    name: Docker — Operator
    needs: [build-binaries, prepare-github-release]
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: pgroles-operator
      IMAGE_REGISTRY: ghcr.io
      IMAGE_REPOSITORY: hardbyte
    steps:
      - uses: actions/checkout@v6

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Linux binary artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: docker-binary-*
          path: dist
          merge-multiple: true

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.runtime
          target: operator-runtime
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.0.0

      - name: Sign image with cosign
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true

  docker-cli:
    name: Docker — CLI
    needs: [build-binaries, prepare-github-release]
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: pgroles
      IMAGE_REGISTRY: ghcr.io
      IMAGE_REPOSITORY: hardbyte
    steps:
      - uses: actions/checkout@v6

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Linux binary artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: docker-binary-*
          path: dist
          merge-multiple: true

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.runtime
          target: cli-runtime
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.0.0

      - name: Sign image with cosign
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true

  # ---------------------------------------------------------------------------
  # Cross-compile CLI binaries for GitHub Releases
  # ---------------------------------------------------------------------------
  build-binaries:
    name: Build — ${{ matrix.binary }} — ${{ matrix.target }}
    needs: [candidate-ci]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            package: pgroles-cli
            binary: pgroles
            release_asset: true
            docker_asset: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            package: pgroles-cli
            binary: pgroles
            release_asset: true
            docker_asset: true
          - target: x86_64-apple-darwin
            os: macos-latest
            package: pgroles-cli
            binary: pgroles
            release_asset: true
            docker_asset: false
          - target: aarch64-apple-darwin
            os: macos-latest
            package: pgroles-cli
            binary: pgroles
            release_asset: true
            docker_asset: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            package: pgroles-operator
            binary: pgroles-operator
            release_asset: false
            docker_asset: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            package: pgroles-operator
            binary: pgroles-operator
            release_asset: false
            docker_asset: true
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Ensure target is installed
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cross --git https://github.com/cross-rs/cross --tag v0.2.5 --locked

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: cargo build --release --package ${{ matrix.package }} --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cross build --release --package ${{ matrix.package }} --target ${{ matrix.target }}

      - name: Package binary
        if: matrix.release_asset
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ARCHIVE="pgroles-${TAG}-${{ matrix.target }}"
          mkdir -p "${ARCHIVE}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${ARCHIVE}/"
          cp README.md LICENSE* "${ARCHIVE}/" 2>/dev/null || true
          cp -R skills "${ARCHIVE}/"
          tar czf "${ARCHIVE}.tar.gz" "${ARCHIVE}"
          echo "ARCHIVE=${ARCHIVE}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload release artifact
        if: matrix.release_asset
        uses: actions/upload-artifact@v6
        with:
          name: binary-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

      - name: Prepare Docker binary artifact
        if: matrix.docker_asset
        shell: bash
        run: |
          mkdir -p docker-dist
          install -Dm755 \
            "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            "docker-dist/${{ matrix.binary }}-${{ matrix.target }}"

      - name: Upload Docker binary artifact
        if: matrix.docker_asset
        uses: actions/upload-artifact@v6
        with:
          name: docker-binary-${{ matrix.binary }}-${{ matrix.target }}
          path: docker-dist/${{ matrix.binary }}-${{ matrix.target }}

  # ---------------------------------------------------------------------------
  # Attach binaries to the draft and publish it
  # ---------------------------------------------------------------------------
  # Runs last, once every other publication has succeeded: publishing the
  # release is what freezes it, so it doubles as the commit point for the whole
  # release. If anything above fails, the release stays a draft and can be
  # deleted and retried.
  github-release:
    name: GitHub Release
    needs:
      - prepare-github-release
      - build-binaries
      - docker-operator
      - docker-cli
      - publish-crates
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: binary-*
          merge-multiple: true

      - name: Attach binaries to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(*.tar.gz)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::No release binaries were downloaded; refusing to publish a release with no assets."
            exit 1
          fi
          for asset in "${assets[@]}"; do
            gh release upload "${GITHUB_REF_NAME}" "$asset" --clobber
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false

  # ---------------------------------------------------------------------------
  # Publish to crates.io
  # ---------------------------------------------------------------------------
  # Runs after the images rather than beside them, because this is the one step
  # that cannot be undone. A GHCR package version can be deleted and a draft
  # release discarded, but a crates.io version can only be yanked — the number is
  # spent either way. Publishing here last means a docker failure no longer burns
  # four crate versions on a release that never completes, and leaves only the
  # attach-and-publish step after it.
  publish-crates:
    name: Publish to crates.io
    needs: [prepare-github-release, docker-operator, docker-cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      # Publish in dependency order. --no-verify because we use SQLX_OFFLINE
      # and the crates.io build environment won't have a database.
      - name: Publish pgroles-core
        run: cargo publish --package pgroles-core --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish pgroles-inspect
        run: cargo publish --package pgroles-inspect --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish pgroles-operator
        run: cargo publish --package pgroles-operator --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        run: sleep 30

      - name: Publish pgroles-cli
        run: cargo publish --package pgroles-cli --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
