            "name": "Phase",
            "type": "string"
          },
          {
            "jsonPath": ".status.sqlRef.name",
            "name": "SQL",
            "priority": 1,
            "type": "string"
          },
          {
            "jsonPath": ".status.sqlHash",
            "name": "Hash",
            "priority": 1,
