{
  "apiVersion": "apiextensions.k8s.io/v1",
  "kind": "CustomResourceDefinition",
  "metadata": {
    "name": "postgrespolicyplans.pgroles.io"
  },
  "spec": {
    "group": "pgroles.io",
    "names": {
      "categories": [
        "pgroles"
      ],
      "kind": "PostgresPolicyPlan",
      "plural": "postgrespolicyplans",
      "shortNames": [
        "pgplan"
      ],
      "singular": "postgrespolicyplan"
    },
    "scope": "Namespaced",
    "versions": [
      {
        "additionalPrinterColumns": [
          {
