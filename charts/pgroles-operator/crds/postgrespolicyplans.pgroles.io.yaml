          },
          {
            "jsonPath": ".status.conditions[?(@.type==\"Approved\")].status",
            "name": "Approved",
            "type": "string"
          },
          {
            "jsonPath": ".status.changeSummary.total",
            "name": "Changes",
            "type": "integer"
          },
          {
