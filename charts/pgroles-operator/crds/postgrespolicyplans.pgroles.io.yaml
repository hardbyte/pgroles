          },
          {
            "jsonPath": ".metadata.creationTimestamp",
            "name": "Age",
            "type": "date"
          }
        ],
        "name": "v1alpha1",
        "schema": {
          "openAPIV3Schema": {
            "description": "Auto-generated derived type for PostgresPolicyPlanSpec via `CustomResource`",
            "properties": {
              "spec": {
                "description": "Spec for a `PostgresPolicyPlan` custom resource.\n\nRepresents a computed reconciliation plan for a `PostgresPolicy`. Plans are\ncreated by the operator and may require explicit approval before execution.",
                "properties": {
                  "managedDatabaseIdentity": {
                    "description": "Database identity string for disambiguation in multi-db setups.",
                    "type": "string"
                  },
                  "origin": {
                    "description": "Origin of this plan. Omitted for ordinary durable reconciliation plans.",
                    "nullable": true,
                    "properties": {
                      "kind": {
                        "type": "string"
                      },
                      "name": {
                        "type": "string"
                      },
                      "uid": {
                        "type": "string"
                      }
                    },
                    "required": [
                      "kind",
                      "name",
                      "uid"
                    ],
                    "type": "object"
                  },
                  "ownedRoles": {
                    "default": [],
                    "description": "Roles that this plan covers.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "ownedSchemas": {
                    "default": [],
                    "description": "Schemas that this plan covers.",
                    "items": {
                      "type": "string"
                    },
                    "type": "array"
                  },
                  "policyGeneration": {
                    "description": "The policy's `.metadata.generation` at plan time.",
                    "format": "int64",
                    "type": "integer"
                  },
                  "policyRef": {
                    "description": "Reference to the policy that generated this plan.",
                    "properties": {
                      "name": {
                        "type": "string"
                      }
                    },
                    "required": [
                      "name"
                    ],
                    "type": "object"
                  },
                  "reconciliationMode": {
                    "description": "Reconciliation mode used for this plan.",
                    "enum": [
                      "authoritative",
                      "additive",
                      "adopt"
                    ],
                    "type": "string"
                  },
                  "scope": {
                    "description": "Narrow execution scope for a non-durable plan.",
                    "nullable": true,
                    "properties": {
                      "bundleHash": {
                        "type": "string"
                      },
                      "kind": {
                        "type": "string"
                      },
                      "operation": {
                        "enum": [
                          "Activate",
                          "Revoke"
                        ],
                        "type": "string"
                      }
                    },
                    "required": [
                      "bundleHash",
                      "kind",
                      "operation"
                    ],
                    "type": "object"
                  }
                },
                "required": [
                  "managedDatabaseIdentity",
                  "policyGeneration",
                  "policyRef",
                  "reconciliationMode"
                ],
                "type": "object"
              },
              "status": {
                "description": "Status of a `PostgresPolicyPlan` resource.\n\nThe decision rules below are the same grammar `EphemeralAccessRequest`\nuses: a decision is terminal, `Approved` and `Denied` cannot both be true,\nand the deciding identity is recorded in the same admitted write. What CEL\ncannot do is check *who* is writing — see [`DecisionActor`].",
                "nullable": true,
                "properties": {
                  "appliedAt": {
                    "description": "Timestamp when the plan was applied (if applicable).",
                    "nullable": true,
                    "type": "string"
                  },
                  "applyingSince": {
                    "description": "Timestamp when the plan entered Applying phase (for stuck detection).",
                    "nullable": true,
                    "type": "string"
                  },
                  "changeDigest": {
                    "description": "Canonical semantic digest of the plan's typed effects, bound to the\nreconciliation mode and target database identity.\n\nThis is the approval identity: a decision approves these effects, and\nexecution proceeds only when the recomputed digest still matches. It is\nstable across recomputation of unchanged effects — notably for password\nchanges, which bind the password *source* rather than the derived\nverifier. See `pgroles_core::approval`.",
                    "nullable": true,
                    "type": "string"
                  },
                  "changeDigestEncoding": {
                    "description": "Version tag of the encoding `change_digest` was computed under. Digests\nfrom different encodings are never comparable.",
                    "nullable": true,
                    "type": "string"
                  },
                  "changeSummary": {
                    "description": "Summary of changes in this plan.",
                    "nullable": true,
                    "properties": {
                      "default_privileges_revoked": {
                        "default": 0,
                        "format": "int32",
                        "type": "integer"
                      },
                      "default_privileges_set": {
                        "default": 0,
                        "format": "int32",
                        "type": "integer"
                      },
                      "grants_added": {
                        "default": 0,
                        "format": "int32",
                        "type": "integer"
                      },
                      "grants_revoked": {
                        "default": 0,
                        "format": "int32",
                        "type": "integer"
                      },
                      "members_added": {
                        "default": 0,
                        "format": "int32",
                        "type": "integer"
                      },
                      "members_removed": {
                        "default": 0,
                        "format": "int32",
                        "type": "integer"
                      },
                      "passwords_set": {
                        "default": 0,
                        "format": "int32",
                        "type": "integer"
                      },
                      "roles_altered": {
                        "default": 0,
                        "format": "int32",
                        "type": "integer"
                      },
                      "roles_created": {
                        "default": 0,
                        "format": "int32",
                        "type": "integer"
                      },
                      "roles_dropped": {
                        "default": 0,
                        "format": "int32",
                        "type": "integer"
                      },
                      "schema_owners_altered": {
                        "default": 0,
                        "format": "int32",
                        "type": "integer"
                      },
                      "schemas_created": {
                        "default": 0,
                        "format": "int32",
                        "type": "integer"
                      },
                      "sessions_terminated": {
                        "default": 0,
                        "format": "int32",
                        "type": "integer"
                      },
                      "total": {
                        "default": 0,
                        "format": "int32",
                        "type": "integer"
                      }
                    },
                    "type": "object"
                  },
                  "computedAt": {
                    "description": "Timestamp when the plan was computed.",
                    "nullable": true,
                    "type": "string"
                  },
                  "conditions": {
                    "default": [],
                    "description": "Standard conditions: Computed, Applied, and the terminal decision\nconditions `Approved` / `Denied`.",
                    "items": {
                      "description": "A condition on the `PostgresPolicy` resource.",
                      "properties": {
                        "last_transition_time": {
                          "description": "Last time the condition transitioned.",
                          "nullable": true,
                          "type": "string"
                        },
                        "message": {
                          "description": "Human-readable message.",
                          "nullable": true,
                          "type": "string"
                        },
                        "reason": {
                          "description": "Human-readable reason for the condition.",
                          "nullable": true,
                          "type": "string"
                        },
                        "status": {
                          "description": "Status: \"True\", \"False\", or \"Unknown\".",
                          "type": "string"
                        },
                        "type": {
                          "description": "Type of condition: \"Ready\", \"Reconciling\", \"Degraded\".",
                          "type": "string"
                        }
                      },
                      "required": [
                        "status",
                        "type"
                      ],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "decidedBy": {
                    "description": "Kubernetes identity which approved or denied this plan.\n\nWritten in the same status update as the terminal decision, and\nwrite-once thereafter. The supplied Kyverno reference policy overwrites\nit from authenticated admission `userInfo`; without that admission layer\nit is an assertion by whoever wrote the status, not a verified identity.",
                    "nullable": true,
                    "properties": {
                      "groups": {
                        "default": [],
                        "items": {
                          "maxLength": 256,
                          "minLength": 1,
                          "type": "string"
                        },
                        "maxItems": 64,
                        "type": "array"
                      },
                      "uid": {
                        "maxLength": 128,
                        "nullable": true,
                        "type": "string"
                      },
                      "username": {
                        "maxLength": 512,
                        "minLength": 1,
                        "type": "string"
                      }
                    },
                    "required": [
                      "username"
                    ],
                    "type": "object"
                  },
                  "failedAt": {
                    "description": "Timestamp when the plan entered Failed phase (for dedup window).",
                    "nullable": true,
                    "type": "string"
                  },
                  "lastError": {
                    "description": "Error message if apply failed.",
                    "nullable": true,
                    "type": "string"
                  },
                  "phase": {
                    "default": "Pending",
                    "description": "Phase: Pending, Approved, Applying, Applied, Failed, Superseded.",
                    "enum": [
                      "Pending",
                      "Approved",
                      "Applying",
                      "Applied",
                      "Failed",
                      "Superseded",
                      "Rejected"
                    ],
                    "type": "string"
                  },
                  "redactedSqlHash": {
                    "description": "SHA-256 hash of the redacted SQL preview bytes. This is for storage\nintegrity only; approval and deduplication use `change_digest`.",
                    "nullable": true,
                    "type": "string"
                  },
                  "revalidatedAt": {
                    "description": "When the plan was most recently confirmed current.",
                    "nullable": true,
                    "type": "string"
                  },
                  "revalidatedGeneration": {
                    "description": "The policy generation this plan was most recently confirmed current\nagainst.\n\nA pending plan is revalidated on every reconcile. When the policy\nchanges but the resulting effects do not, the plan — and any decision\nrecorded on it — is retained and this advances to the new generation.\nIt is provenance, never approval identity: `change_digest` is what a\ndecision binds.",
                    "format": "int64",
                    "nullable": true,
                    "type": "integer"
                  },
                  "sqlHash": {
                    "description": "SHA-256 hash of the planned SQL. Retained as a diagnostic for the\npreview artifact; it is **not** the approval identity, because rendered\nSQL embeds a freshly salted SCRAM verifier for every password change.\nUse `change_digest` for approval and deduplication.",
                    "nullable": true,
                    "type": "string"
                  },
                  "sqlInline": {
                    "description": "Inline SQL for small plans (below a size threshold).",
                    "nullable": true,
                    "type": "string"
                  },
                  "sqlOriginalBytes": {
                    "description": "Uncompressed byte length of the redacted SQL preview.",
                    "format": "int64",
                    "nullable": true,
                    "type": "integer"
                  },
                  "sqlRef": {
                    "description": "Reference to ConfigMap containing the full SQL (for large plans).",
                    "nullable": true,
                    "properties": {
                      "compression": {
                        "description": "Compression used for the referenced SQL content. Missing means older\nuncompressed ConfigMap data.",
                        "enum": [
                          "gzip",
                          null
                        ],
                        "nullable": true,
                        "type": "string"
                      },
                      "key": {
                        "type": "string"
                      },
                      "name": {
                        "type": "string"
                      }
                    },
                    "required": [
                      "key",
                      "name"
                    ],
                    "type": "object"
                  },
                  "sqlStatements": {
                    "description": "Number of SQL statements in the plan (after wildcard expansion).\nMay be significantly larger than `changeSummary.total` when wildcard\ngrants expand to many per-object statements.",
                    "format": "int64",
                    "nullable": true,
                    "type": "integer"
                  },
                  "sqlStoredBytes": {
                    "description": "Stored byte length of the SQL preview after inline/truncation/compression.",
                    "format": "int64",
                    "nullable": true,
                    "type": "integer"
                  },
                  "sqlTruncated": {
                    "default": false,
                    "description": "True when the SQL preview was truncated because the full redacted SQL\ncould not be persisted within Kubernetes object limits.",
                    "type": "boolean"
                  }
                },
                "type": "object",
                "x-kubernetes-validations": [
                  {
                    "message": "Approved=True and Denied=True are mutually exclusive",
                    "rule": "!(self.conditions.exists(c, c.type == 'Approved' && c.status == 'True') && self.conditions.exists(c, c.type == 'Denied' && c.status == 'True'))"
                  },
                  {
                    "message": "plan decisions are terminal",
                    "rule": "oldSelf.conditions.filter(c, (c.type == 'Approved' || c.type == 'Denied') && c.status == 'True').size() == 0 || self.conditions.filter(c, (c.type == 'Approved' || c.type == 'Denied') && c.status == 'True') == oldSelf.conditions.filter(c, (c.type == 'Approved' || c.type == 'Denied') && c.status == 'True')"
                  },
                  {
                    "message": "decision identity is write-once",
                    "rule": "!has(oldSelf.decidedBy) || (has(self.decidedBy) && self.decidedBy == oldSelf.decidedBy)"
                  },
                  {
                    "message": "a terminal plan decision and decidedBy identity must be recorded together",
                    "rule": "self.conditions.exists(c, (c.type == 'Approved' || c.type == 'Denied') && c.status == 'True') == has(self.decidedBy)"
                  }
                ]
              }
            },
            "required": [
              "spec"
            ],
            "title": "PostgresPolicyPlan",
            "type": "object"
          }
        },
        "served": true,
        "storage": true,
        "subresources": {
          "status": {}
        }
      }
    ]
  }
}
