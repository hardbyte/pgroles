{{/*
Kyverno admission policies for the reviewer-decision boundary.

These are rendered from files/kyverno-*.yaml rather than written inline
because the policy bodies are full of Kyverno's own `{{ ... }}` JMESPath
expressions, which Helm would otherwise try to evaluate. `.Files.Get` returns
them verbatim, and nothing in them is install-specific: the plan-decision
policy tells the operator's writes from a reviewer's by SubjectAccessReview on
the logical `manage` verb, which templates/clusterrole.yaml grants, so no
ServiceAccount identity is substituted here.

The resources are cluster-scoped and use fixed names, so enable them from a
single release per cluster.
*/}}
{{- if .Values.admissionPolicies.enabled }}
{{- if .Values.admissionPolicies.planDecision.enabled }}
---
{{ required "files/kyverno-plan-decision.yaml is missing from the packaged chart" (.Files.Get "files/kyverno-plan-decision.yaml") }}
{{- end }}
{{- if .Values.admissionPolicies.ephemeralAccess.enabled }}
---
{{ required "files/kyverno-ephemeral-access.yaml is missing from the packaged chart" (.Files.Get "files/kyverno-ephemeral-access.yaml") }}
{{- end }}
{{- end }}
