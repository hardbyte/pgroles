apiVersion: rbac.authorization.k8s.io/v1
kind: {{ if .Values.operator.watchNamespace }}RoleBinding{{ else }}ClusterRoleBinding{{ end }}
metadata:
  name: {{ include "pgroles-operator.fullname" . }}
  {{- with .Values.operator.watchNamespace }}
  namespace: {{ . | quote }}
  {{- end }}
  labels:
    {{- include "pgroles-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ if .Values.operator.watchNamespace }}Role{{ else }}ClusterRole{{ end }}
  name: {{ include "pgroles-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "pgroles-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace | quote }}
