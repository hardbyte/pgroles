# Default values for pgroles-operator

# -- Replaces the generated name in resource names, keeping the release prefix.
nameOverride: ""
# -- Replaces the full generated name in resource names.
fullnameOverride: ""

# Kyverno admission policies that authenticate reviewer decisions. Without
# them, `decidedBy` on a plan or an ephemeral request is a client-supplied
# assertion and anyone with patch on `.../status` can approve: decisions are
# unattributed and `approval.mode: Required` is not a real approval boundary.
# See https://hardbyte.github.io/pgroles/docs/ephemeral-access-security/
#
# Default off because the resources need Kyverno's CRDs to exist in the
# cluster; enabling this without Kyverno installed fails the install. Turn it
# on once Kyverno is present, or apply the chart-less mirrors in `k8s/security/`.
#
# The rendered resources are cluster-scoped and use fixed names, so enable
# them from one release per cluster. The operator exemption inside the
# plan-decision policy is generated from `operator.serviceAccount.name` and
# the release namespace, so it never has to be edited by hand.
admissionPolicies:
  # -- Render the Kyverno admission policies. Requires Kyverno (v1.18+, for
  # both `kyverno.io/v1` ClusterPolicy and `policies.kyverno.io/v1`
  # ValidatingPolicy) to be installed in the cluster.
  enabled: false
  planDecision:
    # -- Render the PostgresPolicyPlan decision policy, plus the
    # `pgroles-plan-approver` ClusterRole. Only applies when
    # `admissionPolicies.enabled` is true.
    enabled: true
  ephemeralAccess:
    # -- Render the EphemeralAccessRequest decision and lifecycle policies.
    # Only applies when `admissionPolicies.enabled` is true.
    enabled: true

operator:
  # -- Restrict every operator watch/list and its RBAC to one namespace. Empty
  # means cluster-wide reconciliation.
  watchNamespace: ""

  image:
    # -- Operator container image repository.
    repository: ghcr.io/hardbyte/pgroles-operator
    # -- Image pull policy for the operator container.
    pullPolicy: IfNotPresent
    # -- Overrides the image tag whose default is the chart appVersion.
    tag: ""

  # -- Image pull secrets for private registries.
  imagePullSecrets: []

  serviceAccount:
    # -- Specifies whether a service account should be created.
    create: true
    # -- Annotations to add to the service account. Required for GKE Workload
    # Identity: set `iam.gke.io/gcp-service-account` here when using Cloud SQL
    # IAM authentication.
    annotations: {}
    # -- Override the service account name. If unset, uses the fullname template.
    name: ""

  # -- Additional environment variables for the operator container. This is also
  # where operator-wide settings live, since the operator is configured by
  # environment rather than by flags. Notable variables:
  # `OTEL_EXPORTER_OTLP_ENDPOINT` enables OTLP metrics and logs, including
  # structured ephemeral-access audit events; `OTEL_LOGS_EXPORTER=none` disables
  # the log half when another agent already ships container logs off-cluster;
  # `EPHEMERAL_ACCESS_MAXIMUM_DURATION` (default `24h`) and
  # `EPHEMERAL_ACCESS_MAX_PENDING_TTL` (default `1h`) are the only cluster-wide
  # ceilings on ephemeral access, and an access policy exceeding either is
  # rejected with `Accepted=False`.
  env:
    - name: RUST_LOG
      value: "info,pgroles_operator=debug"
    # - name: OTEL_EXPORTER_OTLP_ENDPOINT
    #   value: http://otel-collector.observability.svc.cluster.local:4317
    # - name: OTEL_METRICS_EXPORTER
    #   value: otlp
    # - name: OTEL_LOGS_EXPORTER
    #   value: otlp
    # - name: EPHEMERAL_ACCESS_MAXIMUM_DURATION
    #   value: 24h
    # - name: EPHEMERAL_ACCESS_MAX_PENDING_TTL
    #   value: 1h

  # -- Annotations to add to the operator pod.
  podAnnotations: {}

  http:
    # -- Port serving the `/livez` and `/readyz` probes.
    port: 8080

  probes:
    # -- Liveness probe timing. The operator holds a per-database advisory lock
    # while reconciling, so a probe aggressive enough to restart it mid-reconcile
    # trades a transient failure for a lock wait.
    liveness:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    # -- Readiness probe timing.
    readiness:
      initialDelaySeconds: 2
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3

  # -- Pod-level security context.
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

  # -- Container-level security context. The operator runs as `nobody` with a
  # read-only root filesystem and no capabilities.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65534
    capabilities:
      drop: ["ALL"]

  # -- Resource requests and limits for the operator container.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  # -- Node selector for operator pod scheduling.
  nodeSelector: {}
  # -- Tolerations for operator pod scheduling.
  tolerations: []
  # -- Affinity rules for operator pod scheduling.
  affinity: {}
