apiVersion: v2
name: pgroles-operator
description: >-
  Declarative PostgreSQL role and privilege management.
  Define roles, memberships, grants, and default privileges in YAML
  and let the operator converge your database to the desired state.
type: application
version: 0.9.0
appVersion: "0.9.0"
icon: https://raw.githubusercontent.com/thepartly/pgroles/main/docs/public/logo.svg
sources:
  - https://github.com/thepartly/pgroles
maintainers:
  - name: Brian Thorne
    email: brian@hardbyte.nz
    url: https://hardbyte.nz
annotations:
  artifacthub.io/changes: |
    - kind: added
      description: 'Bounded, request-driven PostgreSQL memberships. EphemeralAccessPolicy defines a requestable bundle; immutable EphemeralAccessRequest resources resolve, activate, expire, and revoke one grant without touching the durable PostgresPolicy. approval.mode Required is only a real approval boundary under admission enforcement — deploy the Kyverno profile in k8s/security/ or front the API with a trusted broker before relying on it. Requires PostgreSQL 16 or later.'
    - kind: added
      description: 'Approving a plan that can never execute is now reported. A policy in mode plan never consults spec.approval, so annotating its plan silently did nothing; the policy now reports an ApprovalIgnored condition and a warning Event.'
    - kind: added
      description: 'A generated Helm chart reference documenting every value, including serviceAccount.annotations for GKE Workload Identity and the EPHEMERAL_ACCESS_MAXIMUM_DURATION and EPHEMERAL_ACCESS_MAX_PENDING_TTL ceilings.'
    - kind: deprecated
      description: 'Omitting spec.approval on a PostgresPolicy. Behaviour is unchanged — the value is still inferred from spec.mode — but policies relying on it now report an ApprovalUnset condition. Write down the value you already get; a future release will reject the omission.'
    - kind: removed
      description: 'PostgresPolicy status fields planned_sql, planned_sql_truncated, and last_reconcile_time, superseded by PostgresPolicyPlan in 0.5.0. Read plan SQL from the plan the policy points at, and replace last_reconcile_time with status.last_successful_reconcile_time.'
  artifacthub.io/category: database
  artifacthub.io/operator: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/operatorCapabilities: Basic Install
  artifacthub.io/license: MIT
  artifacthub.io/links: |
    - name: Source
      url: https://github.com/thepartly/pgroles
  artifacthub.io/crds: |
    - kind: PostgresPolicy
      version: v1alpha1
      name: postgrespolicies.pgroles.io
      displayName: Postgres Policy
      description: Declarative PostgreSQL role graph — roles, memberships, grants, and default privileges.
    - kind: PostgresPolicyPlan
      version: v1alpha1
      name: postgrespolicyplans.pgroles.io
      displayName: Postgres Policy Plan
      description: The SQL a policy proposes to run, published for review and approval before it executes.
    - kind: EphemeralAccessPolicy
      version: v1alpha1
      name: ephemeralaccesspolicies.pgroles.io
      displayName: Ephemeral Access Policy
      description: A requestable bundle of time-bounded PostgreSQL memberships, with who may request it and for how long.
    - kind: EphemeralAccessRequest
      version: v1alpha1
      name: ephemeralaccessrequests.pgroles.io
      displayName: Ephemeral Access Request
      description: One immutable request against an EphemeralAccessPolicy — resolved, activated, expired, and revoked without touching the durable policy.
  artifacthub.io/crdsExamples: |
    - apiVersion: pgroles.io/v1alpha1
      kind: PostgresPolicy
      metadata:
        name: example-policy
      spec:
        connection:
          secretRef:
            name: postgres-credentials
        profiles:
          editor:
            grants:
              - object: { type: table, name: "*" }
                privileges: [SELECT, INSERT, UPDATE, DELETE]
              - object: { type: schema }
                privileges: [USAGE]
          viewer:
            grants:
              - object: { type: table, name: "*" }
                privileges: [SELECT]
              - object: { type: schema }
                privileges: [USAGE]
        schemas:
          - name: public
            profiles: [editor, viewer]
